[package]
name = "polspec"
version = "0.1.0"
edition = "2024"

[lib]
name = "_polspec"
crate-type = ["cdylib"]

[profile.release]
lto = true
codegen-units = 1

[dependencies]
polars = { version = "0.55.2", features = ["dtype-categorical"] }
polars-core = "0.55.2"
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py311"] }
pyo3-polars = { version = "0.28.0", features = ["dtype-categorical"] }
rand = { version = "0.8", features = ["small_rng"] }
rayon = "1.12.0"
