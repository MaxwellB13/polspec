[package]
name = "polspec"
# Single source of truth for the package version: pyproject.toml declares
# `dynamic = ["version"]` and maturin reads this field.
version = "0.1.4"
edition = "2024"

[lib]
name = "_polspec"
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = "thin"

[dependencies]
polars = { version = "0.55.2", features = [
    "dtype-categorical",
    "dtype-i8",
    "dtype-i16",
    "dtype-u8",
    "dtype-u16",
] }
polars-core = { version = "0.55.2", features = [
    "dtype-i8",
    "dtype-i16",
    "dtype-u8",
    "dtype-u16",
] }
# `extension-module` is deliberately not listed here: maturin enables it via
# `[tool.maturin] features` in pyproject.toml. Enabling it unconditionally
# stops `cargo test` from linking against a Python interpreter.
# abi3-py312 matches `requires-python = ">=3.12"`.
pyo3 = { version = "0.29.2", features = ["abi3-py312"] }
pyo3-polars = { version = "0.28.0", features = [
    "dtype-categorical",
    "dtype-full",
] }
rand = { version = "0.8" }
rand_distr = "0.4"
rand_xoshiro = "0.6"
rayon = "1.12.0"
