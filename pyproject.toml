[project]
name = "polspec"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.44.1",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14.0.0"]
ipc = ["pyarrow>=14.0.0"]
yaml = ["pyyaml>=6.0.3"]
all = [
    "pyarrow>=14.0.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
bench = [
    "numpy>=2.5.2",
]
dev = [
    "pytest>=9.1.1",
    "maturin>=1.7",
    "numpy>=2.5.2",
    "pyarrow>=14.0.0",
]

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name = "polspec._polspec"
features = ["pyo3/extension-module"]
