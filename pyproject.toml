[project]
name = "polspec"
# The one place the version is set. Bump with `uv version --bump patch|minor|major`.
# maturin gives this field precedence over Cargo.toml's, which stays a placeholder.
version = "0.6.0"
description = "Declare a Polars schema once, then generate data from it and validate data against it."
readme = "README.md"
authors = [
    { name = "Maxwell Brown", email = "maxbrown130@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["polars", "schema", "validation", "data-generation", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    # Upper bound: the Rust extension links pyo3-polars, which is coupled to a
    # specific Polars release line. Raise the bound deliberately, not by accident.
    "polars>=1.44.1,<2",
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://maxwellb13.github.io/polspec/"
Documentation = "https://maxwellb13.github.io/polspec/"
Repository = "https://github.com/MaxwellB13/polspec"
Issues = "https://github.com/MaxwellB13/polspec/issues"
Changelog = "https://github.com/MaxwellB13/polspec/blob/main/CHANGELOG.md"

[project.scripts]
polspec = "polspec.cli:main"

[project.optional-dependencies]
# PyArrow backs the incremental Parquet and Arrow IPC sinks; everything else
# runs on Polars alone.
arrow = ["pyarrow>=14.0.0"]

[dependency-groups]
bench = [
    "numpy>=2.5.2",
]
dev = [
    "pytest>=9.1.1",
    "maturin>=1.7",
    "numpy>=2.5.2",
    "pyarrow>=14.0.0",
    "mypy>=1.13",
    "ruff>=0.16.5",
]
docs = [
    "mkdocstrings-python>=1.11",
    "mkdocstrings>=0.26",
    "zensical>=0.0.57",
]

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name = "polspec._polspec"
features = ["pyo3/extension-module"]

[tool.ruff]
target-version = "py312"

[tool.ruff.format]
# Code fences in the docs align assignments and trailing comments on purpose;
# leave prose alone and format only real Python.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle, pyflakes
    "I",             # import order
    "UP",            # modern syntax
    "B",             # bugbear
    "BLE",           # blind `except Exception` needs a noqa with a reason
    "SIM",           # simplifications
    "C4",            # comprehensions
    "PIE",
    "RUF",
    "DTZ",           # naive datetimes
    "S",             # bandit
]
ignore = [
    "E501",  # line length is the formatter's job; long strings are allowed
    "S311",  # `random` is the right tool for non-cryptographic sampling
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF012", "DTZ001", "S101", "S102", "S603"]
"examples/*" = ["RUF012", "DTZ001"]
# FrameSpec declarations (`__columns__`, `__foreign_keys__`) are class-level
# mappings by design, as in tests/ and examples/.
"benchmarks/*" = ["S101", "RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["python/polspec"]
# polars ships its own types; nothing else here is imported untyped.
ignore_missing_imports = true

# The package ships py.typed, so every consumer's type checker trusts these
# signatures -- which means nothing in this list is cosmetic. The modules below
# are the backlog from first turning the checker on, kept module by module so
# that everything absent from the list is enforced, and so the list can only
# shrink. Two declarations account for most of it:
#
#   * `ColSpec.dtype` is annotated `pl.DataType | type[pl.DataType]`, which is
#     what the constructor accepts (`ColSpec(pl.Int64)` and `ColSpec(pl.Int64())`
#     both work). `__post_init__` instantiates the class, so a constructed
#     ColSpec always holds an instance -- but the annotation still says it might
#     not, and every `spec.dtype.is_integer()` and `_column_kind(spec.dtype)`
#     downstream is an error against it. 77 of the 247.
#   * `ForeignKey.references` has the same shape: a spec, a class or a name in,
#     always a name once stored. 10 more.
#
# Narrowing either one means separating "what the constructor takes" from "what
# the instance holds", which is a real design decision on a public field rather
# than a fix. Until it is made, these stay listed.
[[tool.mypy.overrides]]
module = [
    "polspec.bound",
    "polspec.catspec",
    "polspec.check",
    "polspec.cli",
    "polspec.constants",
    "polspec.constraints.domain",
    "polspec.constraints.passes",
    "polspec.dtypes",
    "polspec.engine",
    "polspec.foreign_key",
    "polspec.framespec",
    "polspec.generation",
    "polspec.hierarchy",
    "polspec.registry",
    "polspec.report",
    "polspec.rules",
    "polspec.serialization",
    "polspec.serialization.dtypes",
    "polspec.serialization.fields",
    "polspec.spec",
    "polspec.tablespec",
    "polspec.validation",
    "polspec.validation.constraints",
]
ignore_errors = true
