[project]
name = "polspec"
# The one place the version is set. Bump with `uv version --bump patch|minor|major`.
# maturin gives this field precedence over Cargo.toml's, which stays a placeholder.
version = "0.13.0"
description = "Declare a Polars schema once, then generate data from it and validate data against it."
readme = "README.md"
authors = [
    { name = "Maxwell Brown", email = "maxbrown130@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["polars", "schema", "validation", "data-generation", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    # Upper bound: the Rust extension links pyo3-polars, which is coupled to a
    # specific Polars release line. Raise the bound deliberately, not by accident.
    # polspec passes its suite on the Polars 2.0 release candidates (the
    # polars-next CI job); the bound widens to <3 once 2.0 itself is final
    # and that job is green against it.
    "polars>=1.44.1,<2",
    "pyyaml>=6.0.3",
    # Windows ships no IANA database, and a zoned Datetime becoming a Python
    # value -- a finding's samples -- needs one; without it Polars panics.
    "tzdata>=2024.1 ; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://maxwellb13.github.io/polspec/"
Documentation = "https://maxwellb13.github.io/polspec/"
Repository = "https://github.com/MaxwellB13/polspec"
Issues = "https://github.com/MaxwellB13/polspec/issues"
Changelog = "https://github.com/MaxwellB13/polspec/blob/main/CHANGELOG.md"

[project.scripts]
polspec = "polspec.cli:main"

[dependency-groups]
bench = [
    "numpy>=2.5.2",
]
dev = [
    "pytest>=9.1.1",
    "maturin>=1.7",
    "numpy>=2.5.2",
    "pyarrow>=16.0.0",
    "ty>=0.0.75",
    "ruff>=0.16.5",
    "griffelib>=2.3",
    "hypothesis>=6.100",
    "pytest-cov>=6.0",
    "import-linter>=2.1",
]
docs = [
    "mkdocstrings-python>=1.11",
    "mkdocstrings>=0.26",
    "zensical>=0.0.57",
]

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name = "polspec._polspec"
features = ["pyo3/extension-module"]

[tool.ruff]
target-version = "py312"

[tool.ruff.format]
# Code fences in the docs align assignments and trailing comments on purpose;
# leave prose alone and format only real Python.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle, pyflakes
    "I",             # import order
    "UP",            # modern syntax
    "B",             # bugbear
    "BLE",           # blind `except Exception` needs a noqa with a reason
    "SIM",           # simplifications
    "C4",            # comprehensions
    "PIE",
    "RUF",
    "DTZ",           # naive datetimes
    "S",             # bandit
]
ignore = [
    "E501",  # line length is the formatter's job; long strings are allowed
    "S311",  # `random` is the right tool for non-cryptographic sampling
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF012", "DTZ001", "S101", "S102", "S603"]
"examples/*" = ["RUF012", "DTZ001"]
# FrameSpec declarations (`__columns__`, `__foreign_keys__`) are class-level
# mappings by design, as in tests/ and examples/.
"benchmarks/*" = ["S101", "RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Test files are grouped in folders by what they cover, and two folders may
# hold the same basename; importlib mode lets them. `helpers` is importable
# from every folder.
addopts = "--import-mode=importlib"
pythonpath = ["tests"]
# A warning is either expected -- and asserted with pytest.warns or a
# `docs: warns` marker -- or a bug; none is printed and forgotten.
filterwarnings = ["error"]
xfail_strict = true

# `pytest --cov` in CI measures the suite on the locked Polars; the floor
# sits a little under what it reaches, so a change that lands untested code
# fails rather than quietly lowering it.
[tool.coverage.run]
branch = true
source = ["polspec"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

# The package's layering, checked in CI by `lint-imports`. Only direct imports
# count (`allow_indirect_imports`), and not those under `TYPE_CHECKING`: a
# declaration reaching the renderer through `CatSpec.to_markdown` is a
# convenience method, not a dependency of the declaration on how it is drawn.
[tool.importlinter]
root_package = "polspec"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "A declaration is data: no verb, file format or engine behind it"
type = "forbidden"
source_modules = [
    "polspec.bound",
    "polspec.check",
    "polspec.domain",
    "polspec.expr",
    "polspec.foreign_key",
    "polspec.hierarchy",
    "polspec.pass_order",
    "polspec.rules",
    "polspec.spec",
    "polspec.tablespec",
]
forbidden_modules = [
    "polspec._ffi",
    "polspec.cli",
    "polspec.drift",
    "polspec.framespec",
    "polspec.generation",
    "polspec.registry",
    "polspec.render",
    "polspec.serialization",
    "polspec.validation",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Generation knows nothing of validation"
type = "forbidden"
source_modules = ["polspec.generation"]
forbidden_modules = ["polspec.validation"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Validation knows nothing of generation"
type = "forbidden"
source_modules = ["polspec.validation"]
forbidden_modules = ["polspec._ffi", "polspec.generation"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Only generation reaches the Rust extension"
type = "forbidden"
source_modules = [
    "polspec.catspec",
    "polspec.drift",
    "polspec.profiler",
    "polspec.reading",
    "polspec.render",
    "polspec.serialization",
    "polspec.sizing",
    "polspec.validation",
]
forbidden_modules = ["polspec._ffi", "polspec._polspec"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Rendering is reachable from neither generation nor validation"
type = "forbidden"
source_modules = ["polspec.generation", "polspec.validation"]
forbidden_modules = ["polspec.render"]
allow_indirect_imports = true

[tool.ty.src]
include = ["python/polspec"]

# The package ships py.typed, so every consumer's type checker trusts these
# signatures -- nothing the checker reports is cosmetic. Nothing is
# suppressed here: a dataclass whose constructor accepts more than its
# fields hold (`ColSpec`, `Check`, `ForeignKey`) spells the accepted
# signature out in a `TYPE_CHECKING`-only `__init__`, held to the fields
# by a test in `tests/contracts/test_parity.py`.
