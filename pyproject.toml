[project]
name = "polspec"
version = "0.1.4"
description = "Declare a Polars schema once, then generate data from it and validate data against it."
readme = "README.md"
authors = [
    { name = "Maxwell Brown", email = "maxbrown130@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["polars", "schema", "validation", "data-generation", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "polars>=1.44.1",
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://maxwellb13.github.io/polspec/"
Documentation = "https://maxwellb13.github.io/polspec/"
Repository = "https://github.com/MaxwellB13/polars-spec"

[project.scripts]
polspec = "polspec.cli:main"

[project.optional-dependencies]
parquet = ["pyarrow>=14.0.0"]
ipc = ["pyarrow>=14.0.0"]
all = [
    "pyarrow>=14.0.0",
]

[dependency-groups]
bench = [
    "numpy>=2.5.2",
]
dev = [
    "pytest>=9.1.1",
    "maturin>=1.7",
    "numpy>=2.5.2",
    "pyarrow>=14.0.0",
]
docs = [
    "zensical>=0.0.57",
]

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name = "polspec._polspec"
features = ["pyo3/extension-module"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF012", "DTZ001", "S102"]
"example/*" = ["RUF012", "DTZ001"]
