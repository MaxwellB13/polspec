name: Documentation

on:
  push:
    branches:
      - main
    # `python/**` is here because the API reference is `:::` directives that
    # mkdocstrings fills in from the live docstrings: a docstring is
    # documentation source, and a malformed section or a bad cross-reference
    # fails --strict exactly as a broken link does. Without it the build
    # passes on the pull request that breaks it and fails on the next one to
    # touch docs/. (GitHub Actions does not support YAML anchors, so the two
    # lists are spelled out; keep them in step.)
    paths:
      - "docs/**"
      - "zensical.toml"
      - "README.md"
      - "CHANGELOG.md"
      - "python/**"
      - "scripts/generate_llms_txt.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "zensical.toml"
      - "README.md"
      - "CHANGELOG.md"
      - "python/**"
      - "scripts/generate_llms_txt.py"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  build:
    # Runs on pull requests too, so a broken link fails before merge rather
    # than after. Only the push to main deploys.
    name: Build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      # zensical is pinned by uv.lock through the docs group. The project's
      # own dependencies come too -- the llms generator imports polspec from
      # source to read its docstrings -- but not the project itself: no Rust
      # build, since nothing here generates data.
      - name: Install docs tooling
        run: uv sync --no-dev --group docs --no-install-project

      # llms.txt and llms-full.txt are built here, not committed: every page
      # and docstring edit used to regenerate 400 KB of tracked text.
      - name: Generate llms.txt and llms-full.txt
        env:
          PYTHONPATH: python
        run: uv run --no-sync python scripts/generate_llms_txt.py

      - name: Build site
        run: uv run --no-sync zensical build --clean --strict

      - name: Upload site
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
