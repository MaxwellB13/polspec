name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "zensical.toml"
      - "README.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "zensical.toml"
      - "README.md"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  build:
    # Runs on pull requests too, so a broken link fails before merge rather
    # than after. Only the push to main deploys.
    name: Build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.13"

      # zensical is pinned by uv.lock through the docs group.
      - name: Install docs tooling
        run: uv sync --only-group docs --no-install-project

      - name: Build site
        run: uv run --no-sync zensical build --clean --strict

      - name: Upload site
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
