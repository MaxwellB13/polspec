name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  check-version:
    name: Tag matches pyproject.toml and CHANGELOG.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare tag to pyproject.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag" != "$declared" ]; then
            echo "Tag v$tag does not match pyproject.toml version $declared" >&2
            exit 1
          fi
      # v0.4.0 and v0.4.1 both shipped with their notes still under
      # *Unreleased*, which left the changelog claiming a released breaking
      # change had not happened yet. A tag now has to carry its own section.
      - name: Changelog has a section for this version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[$tag\] - " CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [$tag] - YYYY-MM-DD' section." >&2
            echo "Move the Unreleased notes under the new version before tagging." >&2
            exit 1
          fi
          if ! grep -q "^\[$tag\]: https" CHANGELOG.md; then
            echo "CHANGELOG.md has no compare link for [$tag] at the foot." >&2
            exit 1
          fi

  # A tag publishes nothing unless the full test workflow is green.
  test:
    name: Test
    needs: check-version
    uses: ./.github/workflows/test.yml

  build:
    name: Build wheel (${{ matrix.os }}, ${{ matrix.target }})
    needs: [check-version, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64
          - os: macos-latest
            target: aarch64
          - os: macos-latest
            target: x86_64
          - os: windows-latest
            target: x86_64

    steps:
      - uses: actions/checkout@v7

      # One abi3 wheel per platform covers every supported CPython version.
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist
          sccache: "true"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    name: Build sdist
    needs: [check-version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist/*.tar.gz

  publish-pypi:
    name: Publish to PyPI
    needs: [build, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  release:
    name: Attach artifacts to GitHub Release
    needs: [build, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Asks GitHub to write the body from the commits since the previous
          # tag, sorted into the categories `.github/release.yml` declares.
          # Without it that file does nothing: it says how notes should be
          # grouped, not that they should be generated.
          generate_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
