name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  check-version:
    name: Tag matches pyproject.toml and CHANGELOG.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare tag to pyproject.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag" != "$declared" ]; then
            echo "Tag v$tag does not match pyproject.toml version $declared" >&2
            exit 1
          fi
      # v0.4.0 and v0.4.1 both shipped with their notes still under
      # *Unreleased*, which left the changelog claiming a released breaking
      # change had not happened yet. A tag now has to carry its own section.
      - name: Changelog has a section for this version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[$tag\] - " CHANGELOG.md; then
            echo "CHANGELOG.md has no '## [$tag] - YYYY-MM-DD' section." >&2
            echo "Move the Unreleased notes under the new version before tagging." >&2
            exit 1
          fi
          if ! grep -q "^\[$tag\]: https" CHANGELOG.md; then
            echo "CHANGELOG.md has no compare link for [$tag] at the foot." >&2
            exit 1
          fi

  # A tag publishes nothing unless the Test workflow passed on `main` for
  # this commit: the full matrix, already run, rather than run again (1.2's
  # release spent 50 minutes on that). A tag pushed straight after the merge
  # finds the run still going, so this waits for it, up to two hours.
  tested:
    name: Test passed on main for this commit
    needs: check-version
    runs-on: ubuntu-latest
    timeout-minutes: 130
    permissions:
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Wait for the Test run on main
        run: |
          for attempt in $(seq 1 120); do
            run="$(gh run list --workflow test.yml --branch main --event push               --commit "$GITHUB_SHA" --limit 1               --json databaseId,status,conclusion,url               --jq '.[0] // empty')"
            if [ -z "$run" ]; then
              echo "No Test run on main for $GITHUB_SHA yet."
            else
              status="$(jq -r .status <<<"$run")"
              conclusion="$(jq -r .conclusion <<<"$run")"
              url="$(jq -r .url <<<"$run")"
              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  echo "Test passed on main for $GITHUB_SHA: $url"
                  exit 0
                fi
                echo "Test on main for $GITHUB_SHA ended '$conclusion': $url" >&2
                echo "Fix main and tag the fix, or re-run the failed jobs and then this workflow." >&2
                exit 1
              fi
              echo "Test on main for $GITHUB_SHA is $status: $url"
            fi
            sleep 60
          done
          echo "No finished Test run on main for $GITHUB_SHA after two hours." >&2
          echo "Is the tag on a commit that was pushed to main?" >&2
          exit 1

  build:
    name: Build wheel (${{ matrix.os }}, ${{ matrix.target }})
    needs: [check-version, tested]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64
          - os: macos-latest
            target: aarch64
          - os: macos-latest
            target: x86_64
          - os: windows-latest
            target: x86_64

    steps:
      - uses: actions/checkout@v7

      # One abi3 wheel per platform covers every supported CPython version.
      # The build downloads maturin and a Rust toolchain inside its
      # container, and a download that times out fails it -- as 1.1.0's
      # aarch64 build did -- so a failed attempt gets one more.
      # No sccache: a tag's run reads only its own caches and main's, so one
      # release never reused another's, and each left ~600 MB of entries that
      # pushed the repo's cache store past its 10 GB limit.
      - name: Build wheel
        id: build
        continue-on-error: true
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist

      - name: Build wheel (second attempt)
        if: steps.build.outcome == 'failure'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist

      # The suite ran against an editable build; this is the wheel itself,
      # installed alone into a fresh environment, as a user would get it.
      # The macOS runner is Apple silicon, so its x86_64 wheel cannot run
      # here; every other target runs on its own architecture.
      - name: Install Python for the smoke test
        if: ${{ !(matrix.os == 'macos-latest' && matrix.target == 'x86_64') }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Smoke-test the wheel
        if: ${{ !(matrix.os == 'macos-latest' && matrix.target == 'x86_64') }}
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          if [ -x "$RUNNER_TEMP/smoke/bin/python" ]; then
            smoke="$RUNNER_TEMP/smoke/bin/python"
          else
            smoke="$RUNNER_TEMP/smoke/Scripts/python.exe"
          fi
          "$smoke" -m pip install --quiet dist/*.whl
          # From outside the checkout, so `import polspec` finds the wheel.
          cp scripts/smoke_wheel.py "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP" && "$smoke" smoke_wheel.py

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    name: Build sdist
    needs: [check-version, tested]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist/*.tar.gz

  publish-pypi:
    name: Publish to PyPI
    needs: [build, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  release:
    name: Draft the GitHub Release
    needs: [build, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Draft the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # Asks GitHub to write the body from the commits since the previous
          # tag, sorted into the categories `.github/release.yml` declares.
          # Without it that file does nothing: it says how notes should be
          # grouped, not that they should be generated. Through 2.1.0 this
          # was spelled `generate_notes`, an input the action does not have,
          # so it warned and wrote no notes.
          generate_release_notes: true
          # A draft, so the generated notes can be read and edited before
          # anyone else sees them. Publishing is a button on the release
          # page; PyPI is published by the job above regardless.
          draft: true
          files: |
            dist/*.whl
            dist/*.tar.gz
