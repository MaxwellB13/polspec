name: Test

# A pull request runs the corners of the matrix: the oldest and newest
# Python on each OS, with the floor and newest-Polars jobs, eight test jobs
# in all. `main` runs every Python on every OS, and so does the weekly run,
# which catches a runner image or dependency that changed between pushes.
# A release builds only from a commit whose run on `main` passed: see
# release.yml.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * 1" # Mondays, 03:41 UTC
  workflow_dispatch:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          # Each job outside the matrix installs a different set, so each
          # keeps its own cache rather than racing a matrix leg on the same
          # OS and Python to save one key.
          cache-suffix: lint

      # The project itself is not installed: linting needs no Rust build.
      - name: Sync dev dependencies
        run: uv sync --no-install-project

      - name: ruff check
        run: uv run --no-sync ruff check .

      - name: ruff format
        run: uv run --no-sync ruff format --check .

      # The package ships py.typed, so a consumer's type checker trusts these
      # signatures. Nothing is suppressed: see [tool.ty] in pyproject.toml.
      - name: ty
        run: uv run --no-sync ty check

      # The package's layering: see [tool.importlinter] in pyproject.toml.
      # The project is not installed in this job, so the source is put on
      # the path; import-linter reads it and never imports it, so the Rust
      # extension is not needed.
      - name: import-linter
        env:
          PYTHONPATH: python
        run: uv run --no-sync lint-imports

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Install Python (the pyo3 build script needs an interpreter)
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --release -- -D warnings

      - name: cargo test
        run: cargo test --release

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.12", "3.15"]' || '["3.12", "3.13", "3.14", "3.15"]') }}

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-extras --no-install-project

      # Compiles the Rust extension only when its sources changed; see the
      # action. Every later step is `uv run --no-sync`, as a sync would
      # build polspec again.
      - name: Install polspec
        uses: ./.github/actions/install-polspec

      - name: Run tests
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12') }}
        run: uv run --no-sync pytest

      # One leg measures coverage, and fails under the floor set in
      # `[tool.coverage.report]`; the rest only run the suite. It is the
      # oldest Python on Linux, a leg every pull request runs. Coverage starts
      # before pytest, not inside it as `pytest --cov` does: pytest loads
      # polspec's own plugin (the `pytest11` entry point) at start-up, which
      # imports the package before pytest-cov begins, so every module's
      # top-level lines would count as missed.
      - name: Run tests with coverage
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12' }}
        run: |
          uv run --no-sync coverage run -m pytest
          uv run --no-sync coverage report

      - name: Run the worked example as a smoke test
        run: uv run --no-sync python examples/related_specs.py

  polars-latest:
    # uv.lock pins the newest Polars 1.x; this job tests the newest release
    # the bound in pyproject.toml allows -- a Polars 2.x -- so it is also the
    # required run of the tests only Polars 2 has (`Map`). With `test` on the
    # lock and `lowest-direct` on the floor, it covers the supported range's
    # two ends and its newest 1.x.
    name: Test (ubuntu, py3.13, newest polars)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          cache-suffix: newest-polars

      - name: Upgrade polars within the declared bound
        run: uv lock --upgrade-package polars

      - name: Sync dependencies
        run: uv sync --all-extras --no-install-project

      - name: Report polars version
        run: uv run --no-sync python -c "import polars; print(polars.__version__)"

      # Compiles the Rust extension only when its sources changed; see the
      # action. Every later step is `uv run --no-sync`, as a sync would
      # build polspec again.
      - name: Install polspec
        uses: ./.github/actions/install-polspec

      - name: Run tests
        run: uv run --no-sync pytest

  lowest-direct:
    # The oldest release of every direct dependency the bounds allow:
    # `polars>=1.39` and the rest are promises about releases the lock
    # never installs.
    name: Test (ubuntu, py3.12, lowest direct dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          cache-suffix: lowest-direct

      - name: Resolve the lowest direct dependencies
        run: uv lock --resolution lowest-direct

      - name: Sync dependencies
        run: uv sync --all-extras --no-install-project

      - name: Report versions
        run: uv run --no-sync python -c "import polars, yaml; print(polars.__version__, yaml.__version__)"

      # Compiles the Rust extension only when its sources changed; see the
      # action. Every later step is `uv run --no-sync`, as a sync would
      # build polspec again.
      - name: Install polspec
        uses: ./.github/actions/install-polspec

      - name: Run tests
        run: uv run --no-sync pytest
