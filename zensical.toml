[project]
site_name = "polspec"
site_description = "Declare a Polars schema once, then generate data from it and validate data against it."
site_url = "https://maxwellb13.github.io/polspec/"
repo_url = "https://github.com/MaxwellB13/polspec"
repo_name = "MaxwellB13/polspec"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Tutorial" = [
    { "Getting started" = "tutorial/getting-started.md" },
    { "Related tables" = "tutorial/related-tables.md" },
  ] },
  { "How-to guides" = [
    { "Declare columns" = "how-to/columns.md" },
    { "Specs as values" = "how-to/tablespec.md" },
    { "Constraints" = "how-to/constraints.md" },
    { "Generate data" = "how-to/generating.md" },
    { "Validate data" = "how-to/validating.md" },
    { "Shared categories" = "how-to/categories.md" },
    { "Specs as files" = "how-to/files.md" },
    { "Multiple specs" = "how-to/registry.md" },
    { "Generated documentation" = "how-to/documenting.md" },
    { "Test pipelines" = "how-to/testing.md" },
    { "Command line" = "how-to/cli.md" },
  ] },
  { "Reference" = [
    { "API" = [
      { "Overview" = "reference/api/index.md" },
      { "Columns" = "reference/api/columns.md" },
      { "Predicates" = "reference/api/predicates.md" },
      { "Specs" = "reference/api/specs.md" },
      { "Registry and categories" = "reference/api/registry.md" },
      { "Validation results" = "reference/api/validation.md" },
      { "Profiling" = "reference/api/profiling.md" },
      { "Exceptions" = "reference/api/errors.md" },
    ] },
    { "Errors and findings" = "reference/errors.md" },
  ] },
  { "Explanation" = [
    { "Architecture" = "explanation/architecture.md" },
    { "Generation and validation" = "explanation/two-sides.md" },
    { "Known limitations" = "explanation/limitations.md" },
    { "Comparison" = "explanation/comparison.md" },
    { "Roadmap and stability" = "explanation/roadmap.md" },
  ] },
  { "Changelog" = "changelog.md" },
]

[project.plugins.mkdocstrings.handlers.python]
paths = ["python"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
filters = ["!^_"]
heading_level = 3
members_order = "source"
merge_init_into_class = true
separate_signature = true
show_bases = false
show_root_heading = true
show_root_full_path = false
show_signature_annotations = true
show_source = false
show_symbol_type_heading = true
show_symbol_type_toc = true
signature_crossrefs = true

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/MaxwellB13/polspec"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
