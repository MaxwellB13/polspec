[project]
site_name = "polspec"
site_description = "Declare a Polars schema once, then generate data from it and validate data against it."
site_url = "https://maxwellb13.github.io/polspec/"
repo_url = "https://github.com/MaxwellB13/polspec"
repo_name = "MaxwellB13/polspec"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Comparison" = "comparison.md" },
  { "Guide" = [
    { "Declaring columns" = "guide/columns.md" },
    { "Constraints" = "guide/constraints.md" },
    { "Generating data" = "guide/generating.md" },
    { "Validating data" = "guide/validating.md" },
    { "Shared categories" = "guide/categories.md" },
    { "YAML specs" = "guide/yaml.md" },
    { "Generated documentation" = "guide/documenting.md" },
    { "Command line" = "guide/cli.md" },
    { "Testing pipelines" = "guide/testing.md" },
  ] },
  { "Reference" = [
    { "Architecture" = "reference/architecture.md" },
    { "Known limitations" = "reference/limitations.md" },
    { "Roadmap and stability" = "reference/roadmap.md" },
  ] },
]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/MaxwellB13/polspec"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
